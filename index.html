<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pxtr.pattira だ</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mitr', sans-serif; background-color: #fefcf0; display: flex; flex-direction: column; align-items: center; padding: 0; margin: 0; color: #555; }
        
        /* แถบหัวเว็บด้านบนสุด */
        .top-header { width: 100%; background-color: #8B2323; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; box-sizing: border-box; box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin-bottom: 20px; }
        .header-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .header-profile-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .header-title { color: white; font-size: 18px; font-weight: 500; letter-spacing: 0.5px; }
        
        /* ปุ่มสลับโหมด Guest / Admin มุมขวาบน */
        .mode-btn { background-color: white; border: none; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-family: 'Mitr', sans-serif; font-size: 14px; font-weight: 500; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: 0.2s; }
        .mode-btn:hover { background-color: #f0f0f0; }

        .banner { width: 90%; max-width: 400px; height: auto; border-radius: 25px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); object-fit: cover; cursor: pointer; }
        .info { text-align: center; margin-bottom: 20px; }
        .card { background-color: white; border: 2px solid #ffb7c5; border-radius: 30px; padding: 20px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .stars { font-size: 35px; color: #ddd; cursor: pointer; margin: 10px 0; }
        .stars span.active { color: #ff9aa2; }
        .submit-btn { background-color: #ffdac1; border: none; padding: 10px 25px; border-radius: 20px; font-size: 16px; cursor: not-allowed; opacity: 0.6; transition: 0.3s; }
        .submit-btn.enabled { cursor: pointer; opacity: 1; background-color: #ff9aa2; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; overflow-y: auto; }
        .modal-content { background: white; padding: 25px; border-radius: 30px; width: 90%; max-width: 350px; position: relative; margin: 20px 0; }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 24px; }
        input, textarea { width: 100%; margin: 8px 0; padding: 12px; border: 2px solid #eee; border-radius: 15px; box-sizing: border-box; font-family: 'Mitr', sans-serif; }
        .upload-box { border: 2px dashed #ffb7c5; padding: 15px; text-align: center; cursor: pointer; border-radius: 15px; margin-bottom: 10px; color: #ff9aa2; width: 100%; box-sizing: border-box; }
        .review-item { background: white; border: 2px solid #ffb7c5; border-radius: 25px; padding: 20px; width: 90%; max-width: 350px; margin-bottom: 15px; position: relative; }
        .action-btns { position: absolute; top: 10px; right: 15px; display: flex; gap: 8px; }
        .admin-action-btn { cursor: pointer; font-weight: bold; background: none; border: none; font-family: 'Mitr', sans-serif; font-size: 14px; }
        .edit-icon { color: #4A90E2; display: none; }
        .del-btn { color: #ff9aa2; display: none; }
        .profile-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 10px; }
    </style>
</head>
<body>
    <!-- แถบ Header ด้านบนสุด -->
    <div class="top-header">
        <div class="header-left" onclick="handleHeaderClick()" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์ (เฉพาะ Admin)">
            <img id="headerProfileImg" src="https://via.placeholder.com/150" alt="Profile" class="header-profile-img">
            <span class="header-title" id="headerTitleText">JAOLOVE.STUDIO16</span>
        </div>
        <div>
            <button id="modeToggleBtn" class="mode-btn" onclick="toggleMode()">Guest</button>
        </div>
    </div>

    <!-- รูป Banner หลัก (Admin สามารถคลิกเปลี่ยนรูปได้ทันทีเมื่ออยู่ในโหมด Admin) -->
    <img id="mainBanner" src="https://via.placeholder.com/400x200?text=Banner+Image" alt="Banner" class="banner" onclick="promptChangeBanner()" title="คลิกเพื่อเปลี่ยน Banner (เฉพาะ Admin)">
    
    <div class="info">
        <h1>⁺‧⊹ ࣪ ˖ 🖤₊˚ ⋆ 𝒄𝒓𝒆𝒅𝒊𝒕 𝒇𝒐𝒓 𝒑𝒂𝒕𝒕𝒊𝒓𝒂 だ ⋆ ˚🕸️๋࣭ ⭑ ‧⁺</h1>
        <p>ขอบคุณลูกค้าที่น่ารักที่แวะมารีวิวให้เค้าน้าค้าบ ☁️✨</p>
        <p id="totalReviewsCount" style="font-weight: 500; color: #ff9aa2; margin-top: 5px;"></p>
    </div>
    <div class="card">
        <h3>plus one for pattira だ</h3>
        <div class="stars" id="star-container">
            <span onclick="setRating(1)">★</span><span onclick="setRating(2)">★</span><span onclick="setRating(3)">★</span><span onclick="setRating(4)">★</span><span onclick="setRating(5)">★</span>
        </div>
        <button id="submit-btn" class="submit-btn" disabled onclick="openModal()">กดเพื่อรีวิว</button>
    </div>
    <div id="reviewList" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    
    <!-- Modal สำหรับเพิ่ม/แก้ไขรีวิว -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">ฝากรีวิวถึงเค้าหน่อยน้า 💌</h2>
            
            <p style="margin: 5px 0; font-size: 14px; text-align: left;">ประเภทงานที่สั่ง</p>
            <input type="text" id="reviewTitle" placeholder="เช่น สั่งทำป้ายบัญชี">
            
            <p style="margin: 5px 0; font-size: 14px; text-align: left;">ความรู้สึกหลังได้รับบริการ</p>
            <textarea id="reviewContent" placeholder="(ติชมได้นะคะ ร้านจะนำไปปรับปรุงอย่างแน่นอนค่ะ)"></textarea>
            
            <p style="margin: 5px 0; font-size: 14px; text-align: left;">ลิงก์รูปโปรไฟล์ (Google Drive)</p>
            <input type="text" id="profileDriveLink" placeholder="วางลิงก์ Google Drive รูปโปรไฟล์">

            <p style="margin: 5px 0; font-size: 14px; text-align: left;">อัปโหลดรูปรีวิว</p>
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">🖼 อัปโหลดรูปรีวิว</div>
            <input type="file" id="fileInput" hidden onchange="handleImage(event)">
            
            <button id="modalSubmitBtn" onclick="submitData()" style="width: 100%; padding: 12px; border-radius: 20px; border: none; background: #ff9aa2; color: white; margin-top: 10px; font-family: 'Mitr', sans-serif;">ส่งรีวิว</button>
        </div>
    </div>
    <script>
        let currentRating = 0; let reviewImgBase64 = "";
        let currentMode = 'guest';
        let editingReviewKey = null; // ตัวแปรเก็บสถานะการแก้ไขรีวิว
        
        window.onload = function() {
            fetchReviews();
            loadSavedImages();
        };

        // ฟังก์ชันแปลงลิงก์ Google Drive ให้เป็น Direct Image Link อัตโนมัติ
        function convertDriveLink(url) {
            if (!url) return "";
            if (url.includes("drive.google.com")) {
                let fileId = "";
                if (url.includes("/file/d/")) {
                    fileId = url.split("/file/d/")[1].split("/")[0];
                } else if (url.includes("id=")) {
                    fileId = url.split("id=")[1].split("&")[0];
                }
                if (fileId) {
                    return `https://lh3.googleusercontent.com/d/${fileId}`;
                }
            }
            return url;
        }

        // สลับโหมดระหว่าง Guest และ Admin
        function toggleMode() {
            if (currentMode === 'guest') {
                const pass = prompt("Enter Admin Password:");
                if (pass === "310543") {
                    currentMode = 'admin';
                    document.getElementById('modeToggleBtn').innerText = "Admin";
                    alert("Admin mode activated successfully");
                    fetchReviews();
                } else {
                    alert("Incorrect password");
                }
            } else {
                currentMode = 'guest';
                document.getElementById('modeToggleBtn').innerText = "Guest";
                alert("Switched to Guest mode");
                fetchReviews();
            }
        }

        // คลิกเปลี่ยนรูปโปรไฟล์ด้านบน (เฉพาะตอนเป็น Admin)
        function handleHeaderClick() {
            if (currentMode === 'admin') {
                let link = prompt("วางลิงก์รูปภาพ Google Drive สำหรับรูปโปรไฟล์ด้านบน:");
                if (link) {
                    let converted = convertDriveLink(link);
                    if (converted) {
                        localStorage.setItem('customHeaderProfile', converted);
                        document.getElementById('headerProfileImg').src = converted;
                        alert("Profile picture updated successfully");
                    } else {
                        alert("Invalid link");
                    }
                }
            } else {
                alert("กรุณาเข้าสู่ระบบ Admin ก่อนเปลี่ยนรูปโปรไฟล์");
            }
        }

        // คลิกเปลี่ยน Banner (เฉพาะตอนเป็น Admin)
        function promptChangeBanner() {
            if (currentMode === 'admin') {
                let link = prompt("วางลิงก์รูปภาพ Google Drive สำหรับรูป Banner:");
                if (link) {
                    let converted = convertDriveLink(link);
                    if (converted) {
                        localStorage.setItem('customBanner', converted);
                        document.getElementById('mainBanner').src = converted;
                        alert("Banner updated successfully");
                    } else {
                        alert("Invalid link");
                    }
                }
            }
        }

        // โหลดรูปภาพที่บันทึกไว้
        function loadSavedImages() {
            let savedBanner = localStorage.getItem('customBanner');
            if (savedBanner) {
                document.getElementById('mainBanner').src = savedBanner;
            }
            let savedProfile = localStorage.getItem('customHeaderProfile');
            if (savedProfile) {
                document.getElementById('headerProfileImg').src = savedProfile;
            } else {
                document.getElementById('headerProfileImg').src = "https://via.placeholder.com/150";
            }
        }

        function setRating(r) {
            currentRating = r; 
            document.querySelectorAll('.stars span').forEach((s, i) => s.className = i < r ? 'active' : '');
            document.getElementById('submit-btn').disabled = false; 
            document.getElementById('submit-btn').classList.add('enabled');
        }

        function openModal() { 
            editingReviewKey = null;
            document.getElementById('modalTitle').innerText = "ฝากรีวิวถึงเค้าหน่อยน้า 💌";
            document.getElementById('modalSubmitBtn').innerText = "ส่งรีวิว";
            document.getElementById('reviewTitle').value = "";
            document.getElementById('reviewContent').value = "";
            document.getElementById('profileDriveLink').value = "";
            reviewImgBase64 = "";
            currentRating = 0;
            document.querySelectorAll('.stars span').forEach(s => s.className = '');
            document.getElementById('reviewModal').style.display = 'flex'; 
        }

        function closeModal() { document.getElementById('reviewModal').style.display = 'none'; }
        function handleImage(e) { const reader = new FileReader(); reader.onload = (ev) => reviewImgBase64 = ev.target.result; reader.readAsDataURL(e.target.files[0]); }

        // ฟังก์ชันส่งข้อมูล (รองรับทั้งเพิ่มใหม่และแก้ไขข้อมูลเดิม)
        async function submitData() {
            let rawProfileLink = document.getElementById('profileDriveLink').value;
            let processedProfileImg = convertDriveLink(rawProfileLink);

            const data = { 
                title: document.getElementById('reviewTitle').value, 
                content: document.getElementById('reviewContent').value, 
                rating: currentRating, 
                profileImg: processedProfileImg || (editingReviewKey ? window.currentEditingProfileImg : ""), 
                reviewImg: reviewImgBase64 || (editingReviewKey ? window.currentEditingReviewImg : ""), 
                timestamp: new Date().toLocaleString() 
            };

            if (editingReviewKey) {
                // กรณีแก้ไขข้อมูลเดิม
                await fetch(`https://save-review-54d0b-default-rtdb.firebaseio.com/reviews/${editingReviewKey}.json`, { 
                    method: "PUT", 
                    body: JSON.stringify(data), 
                    headers: { "Content-Type": "application/json" } 
                });
                alert('แก้ไขรีวิวสำเร็จ!');
            } else {
                // กรณีเพิ่มรีวิวใหม่
                await fetch("https://save-review-54d0b-default-rtdb.firebaseio.com/reviews.json", { 
                    method: "POST", 
                    body: JSON.stringify(data), 
                    headers: { "Content-Type": "application/json" } 
                });
                alert('ขอบคุณสำหรับรีวิวนะคะ!');
            }
            closeModal(); 
            fetchReviews();
        }

        // ดึงรายการรีวิวทั้งหมดมาแสดง และเปิดปุ่มแก้ไข/ลบ เฉพาะโหมด Admin
        async function fetchReviews() {
            const res = await fetch("https://save-review-54d0b-default-rtdb.firebaseio.com/reviews.json");
            const data = await res.json();
            const list = document.getElementById('reviewList'); 
            list.innerHTML = "";
            let count = 0;

            for (let key in data) {
                count++;
                let r = data[key];
                let actionStyle = currentMode === 'admin' ? 'display: inline;' : 'display: none;';
                list.innerHTML += `
                    <div class="review-item">
                        <div class="action-btns">
                            <button class="admin-action-btn edit-icon" style="${actionStyle}" onclick="editReview('${key}', '${encodeURIComponent(r.title)}', '${encodeURIComponent(r.content)}', ${r.rating}, '${r.profileImg || ''}', '${r.reviewImg || ''}')">✏️</button>
                            <button class="admin-action-btn del-btn" style="${actionStyle}" onclick="deleteReview('${key}')">✖</button>
                        </div>
                        <div style="color: #ff9aa2;">${'★'.repeat(r.rating)}</div>
                        <h3>ประเภทงาน: ${r.title}</h3>
                        <p>${r.content}</p>
                        ${r.reviewImg ? `<img src="${r.reviewImg}" style="width:80px; border-radius:10px;">` : ''}
                        <div style="display:flex; align-items:center; margin-top:10px;">
                            ${r.profileImg ? `<img src="${r.profileImg}" class="profile-img">` : ''}
                            <div><small>${r.timestamp}</small></div>
                        </div>
                    </div>`;
            }
            document.getElementById('totalReviewsCount').innerText = `รีวิวการใช้บริการทั้งหมด (${count} รีวิว)`;
        }

        // ฟังก์ชันเปิด Modal เพื่อแก้ไขรีวิว
        function editReview(key, title, content, rating, profileImg, reviewImg) {
            if (currentMode !== 'admin') return;
            editingReviewKey = key;
            window.currentEditingProfileImg = decodeURIComponent(profileImg);
            window.currentEditingReviewImg = decodeURIComponent(reviewImg);

            document.getElementById('modalTitle').innerText = "แก้ไขรีวิว 🛠️";
            document.getElementById('modalSubmitBtn').innerText = "บันทึกการแก้ไข";
            document.getElementById('reviewTitle').value = decodeURIComponent(title);
            document.getElementById('reviewContent').value = decodeURIComponent(content);
            document.getElementById('profileDriveLink').value = decodeURIComponent(profileImg);
            
            setRating(rating);
            reviewImgBase64 = "";
            document.getElementById('reviewModal').style.display = 'flex';
        }

        // ฟังก์ชันลบรีวิว
        async function deleteReview(key) {
            if (currentMode !== 'admin') {
                alert("Admin access required");
                return;
            }
            if (confirm("Are you sure you want to delete this review?")) {
                await fetch(`https://save-review-54d0b-default-rtdb.firebaseio.com/reviews/${key}.json`, { method: "DELETE" });
                fetchReviews();
            }
        }
    </script>
</body>
</html>
